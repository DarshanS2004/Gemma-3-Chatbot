<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gemma Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-topbar">
          <button class="chrome-button" id="sidebar-toggle" aria-label="Toggle sidebar" data-tooltip="Collapse menu" data-tooltip-position="bottom">
            <span class="icon-hamburger" aria-hidden="true"><span></span><span></span><span></span></span>
          </button>
          <button class="chrome-button" id="sidebar-search-toggle" aria-label="Search chats" data-tooltip="Search chats" data-tooltip-position="bottom">
            <svg viewBox="0 0 24 24" class="icon-svg" aria-hidden="true">
              <circle cx="11" cy="11" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
              <path d="M15.5 15.5L20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
            </svg>
          </button>
        </div>

        <div class="brand-lockup sidebar-lockup">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-core"></span>
          </span>
          <div class="sidebar-brand">Gemma</div>
        </div>

        <button class="sidebar-primary nav-tile" id="new-chat-btn" data-tooltip="New chat" data-tooltip-position="right">
          <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true">
            <path d="M4 20h4l10-10-4-4L4 16v4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"></path>
            <path d="M13 7l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          </svg>
          <span class="nav-label">New chat</span>
        </button>

        <div class="sidebar-search-wrap">
          <svg viewBox="0 0 24 24" class="sidebar-search-icon" aria-hidden="true">
            <circle cx="11" cy="11" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"></circle>
            <path d="M15.5 15.5L20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
          </svg>
          <input class="sidebar-search" id="history-search" type="text" placeholder="Search chats">
        </div>

        <div class="sidebar-label">Chats</div>
        <div class="chat-scroll">
          <div class="chat-list" id="chat-list"></div>
        </div>

        <button class="sidebar-footer nav-tile" type="button" data-action="open-settings" data-tooltip="Settings" data-tooltip-position="right">
          <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true">
            <path d="M12 3.6l1.3 1.1 1.8-.3.9 1.6 1.8.4v1.9l1.5 1-.7 1.7.7 1.7-1.5 1v1.9l-1.8.4-.9 1.6-1.8-.3L12 20.4l-1.3-1.1-1.8.3-.9-1.6-1.8-.4v-1.9l-1.5-1 .7-1.7-.7-1.7 1.5-1V6.4l1.8-.4.9-1.6 1.8.3L12 3.6Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path>
            <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
          </svg>
          <span class="nav-label">Settings</span>
        </button>
      </aside>

      <main class="main-panel">
        <div class="brand-lockup main-lockup">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-core"></span>
          </span>
          <div class="main-brand">Gemma</div>
        </div>
        <section id="main-view"></section>
      </main>
    </div>

    <div id="toast" class="toast"></div>
    <div id="tooltip-root" class="app-tooltip" hidden></div>
    <div id="modal-root"></div>
    <input id="hidden-doc-upload" type="file" multiple accept=".pdf,.docx,.txt,.md,.csv,.tsv,.json" hidden>
    <input id="hidden-image-upload" type="file" multiple accept=".png,.jpg,.jpeg,.webp,.gif" hidden>

    <script>
      window.__BOOTSTRAP__ = {
        userName: {{ user_name|tojson }}
      };
    </script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
